services:
  db:
    image: postgres:16-alpine
    container_name: experticia-demo-db
    environment:
      POSTGRES_DB: experticia_demo
      POSTGRES_USER: experticia
      POSTGRES_PASSWORD: experticia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U experticia -d experticia_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opcional: backend en contenedor (por defecto se corre local con manage.py)
  backend:
    profiles: ["full"]
    build:
      context: ./backend
    container_name: experticia-demo-backend
    environment:
      DB_HOST: db
      DB_NAME: experticia_demo
      DB_USER: experticia
      DB_PASSWORD: experticia
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  pgdata:
