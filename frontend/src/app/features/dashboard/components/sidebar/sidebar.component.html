<aside class="sidebar">
  <div class="section-title">MONITOREO IIOT</div>

  <nav class="nav">
    @for (item of items; track item.label) {
      <button class="nav-item" [class.active]="item.active" (click)="onNavigate(item)">
        <lucide-icon [name]="item.icon" [size]="16" />
        <span class="nav-label">{{ item.label }}</span>
        @if (item.badge && alertsTotal > 0) {
          <span class="nav-badge">{{ alertsTotal }}</span>
        }
        @if (item.expandable) {
          <lucide-icon name="chevron-down" [size]="14" class="expand" />
        }
      </button>
    }
  </nav>

  <div class="section-title quick">VISTA RÁPIDA</div>
  <button class="nav-item" (click)="onNavigate({ icon: '', label: 'Flujo del proceso' })">
    <lucide-icon name="workflow" [size]="16" />
    <span class="nav-label">Flujo del proceso</span>
  </button>

  <div class="sidebar-footer">
    Plataforma IIoT Experticia<br>v2.1.0
  </div>
</aside>
