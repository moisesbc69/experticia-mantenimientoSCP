<div class="kpi-row">
  @for (kpi of kpis; track kpi.key) {
    <button class="kpi-card" [title]="kpi.simulated ? 'Dato simulado (demo) — clic para ver detalle' : 'Clic para ver detalle'" (click)="onKpiClick(kpi)">
      <div class="kpi-head">
        <span class="kpi-icon" [class.status-ok]="isStatusCard(kpi) && statusOk(kpi)">
          <lucide-icon [name]="iconFor(kpi)" [size]="16" />
        </span>
        <span class="kpi-label">{{ kpi.label | uppercase }}</span>
      </div>

      @if (isStatusCard(kpi)) {
        <div class="kpi-value status-text" [class.ok]="statusOk(kpi)">{{ kpi.value }}</div>
        <div class="kpi-comparison">{{ kpi.comparison }}</div>
      } @else {
        <div class="kpi-value">
          {{ kpi.value }}
          @if (kpi.unit) {
            <span class="kpi-unit">{{ kpi.unit }}</span>
          }
          @if (kpi.delta) {
            <span class="kpi-delta" [class.good]="kpi.delta_positive" [class.bad]="!kpi.delta_positive">
              {{ kpi.direction === 'down' ? '↓' : '↑' }} {{ kpi.delta }}
            </span>
          }
        </div>
        <div class="kpi-comparison">{{ kpi.comparison }}</div>
      }
    </button>
  }
</div>
