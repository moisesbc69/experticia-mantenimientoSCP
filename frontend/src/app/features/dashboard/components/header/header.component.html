<header class="header">
  <button class="hamburger" (click)="layout.toggleSidebar()" aria-label="Abrir menú">
    <lucide-icon name="menu" [size]="22" />
  </button>

  <div class="brand">
    <span class="brand-mark">E</span>
    <span class="brand-name">EXPERTICIA</span>
  </div>

  <div class="plant-selector" [class.open]="dropdownOpen()">
    <button class="selector-btn" (click)="toggleDropdown()">
      <lucide-icon name="search" [size]="15" class="icon-dim" />
      <span class="plant-name">{{ state.plant()?.name ?? 'Seleccionar planta' }}</span>
      <span class="status-pill" [class.warn]="!statusOk">{{ state.plant()?.general_status ?? '—' }}</span>
      <lucide-icon name="chevron-down" [size]="15" class="icon-dim chevron" />
    </button>

    @if (dropdownOpen()) {
      <div class="dropdown">
        @for (p of state.plants(); track p.id) {
          <button class="dropdown-item" [class.active]="p.id === state.selectedPlantId()" (click)="pickPlant(p)">
            <span>{{ p.name }}</span>
            <span class="mini-status" [class.warn]="!p.general_status.toLowerCase().includes('normal')">
              {{ p.general_status }}
            </span>
          </button>
        }
      </div>
    }
  </div>

  <div class="spacer"></div>

  <button class="header-item alerts" (click)="goAlertas()">
    <span class="bell-wrap">
      <lucide-icon name="bell" [size]="17" />
      @if (state.alertsTotal() > 0) {
        <span class="badge">{{ state.alertsTotal() }}</span>
      }
    </span>
    <span class="label">Alertas</span>
  </button>

  <button class="header-item theme" title="Tema" (click)="decorative()">
    <lucide-icon name="sun-medium" [size]="17" />
  </button>

  <button class="header-item lang" (click)="decorative()">
    <lucide-icon name="globe" [size]="16" />
    <span class="label">ES</span>
  </button>

  <div class="user">
    <span class="avatar">JP</span>
    <span class="user-info">
      <span class="user-name">Joan Pérez</span>
      <span class="user-role">Administrador</span>
    </span>
    <lucide-icon name="chevron-down" [size]="14" class="icon-dim" />
  </div>

  <div class="client-logo" title="Antofagasta Minerals">
    <svg class="amsa-mark" viewBox="0 0 54 42" aria-hidden="true">
      <defs>
        <linearGradient id="amsaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#5fb3c4" />
          <stop offset="42%" stop-color="#9fd2d8" />
          <stop offset="60%" stop-color="#f39200" />
          <stop offset="100%" stop-color="#e2331a" />
        </linearGradient>
      </defs>
      <!-- Cerro trasero (degradado teal → naranjo) -->
      <path d="M27 2 L52 40 L41 40 L22 12 Z" fill="url(#amsaGrad)" />
      <path d="M27 2 L22 12 L11 40 L2 40 Z" fill="#8bc7cf" />
      <!-- Cerros frontales (tonos claros) -->
      <path d="M13 40 L21 25 L29 40 Z" fill="#a9dbe1" />
      <path d="M31 40 L39 25 L47 40 Z" fill="#c9e7eb" />
    </svg>
    <span class="client-name">
      <span class="cn-1">ANTOFAGASTA</span>
      <span class="cn-2">MINERALS</span>
    </span>
  </div>
</header>

<div class="subheader">
  <span class="clock">{{ clock() }}</span>
  <span class="realtime">Tiempo real <span class="pulse"></span></span>
</div>
